services:
  - type: web
    name: studymate-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: FRONTEND_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: RATE_LIMIT_DEFAULT
        value: 30/minute
      - key: RATE_LIMIT_AI_ENDPOINTS
        value: 15/minute

